; PlatformIO project for the ESP8266 hardware-in-the-loop bench build.
; See README.md in this folder for wiring, build, and flash instructions.

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200

; ESP8266 Arduino cores in common use support gnu++17. If your installed
; core is older and rejects this, drop to -std=gnu++14 -- nothing in the
; shared FSM code (states.cpp, sensors.cpp, etc.) uses C++17-only features,
; it was just compiled with -std=c++17 on desktop.
build_flags =
    -std=gnu++17
    -Wall

; This project has no lib/ or shared include/src of its own checked in --
; sync_shared_sources.py (run automatically before every build) copies the
; FSM/filters/faults/telemetry/etc. sources from the repo root's include/
; and src/ into lib/avionics_core/ so PlatformIO's library auto-discovery
; picks them up. That keeps ONE copy of the flight logic for both the
; desktop g++ build and this firmware -- edit the root include/ and src/
; files, not anything under lib/.
extra_scripts = pre:sync_shared_sources.py

lib_deps =
    adafruit/Adafruit BMP280 Library @ ^2.6.8
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    adafruit/Adafruit BusIO @ ^1.16.1
    mikalhart/TinyGPSPlus @ ^1.0.3
    sandeepmistry/LoRa @ ^0.8.0

; Library versions above are pinned to what was current when this was
; written -- bump them if PlatformIO reports a newer release, but re-check
; the LoRa.setPins()/LoRa.begin() call in src/hal_esp8266.cpp still matches
; that library's API if you jump a major version.
